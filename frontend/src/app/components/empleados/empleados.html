<div class="container">
    <div class="row">
        <div class="col s12">
            <div class="card">
                <form #empleadoForm="ngForm" (ngSubmit)="agregarEmpleado(empleadoForm)">
                    <div class="card-content">
                        <span class="card-title">Formulario de Empleados</span>

                        <!-- Campo Nombre -->
                        <div class="row">
                            <div class="input-field col s12">
                                <input type="text" id="nombre" name="name"
                                    [(ngModel)]="empleadoService.selectedEmpleado.name"
                                    placeholder="Nombre del empleado" required />
                                <label for="nombre">Nombre</label>
                            </div>
                        </div>

                        <!-- Campo Cargo -->
                        <div class="row">
                            <div class="input-field col s12">
                                <input type="text" id="cargo" name="position"
                                    [(ngModel)]="empleadoService.selectedEmpleado.position"
                                    placeholder="Cargo del empleado" required />
                                <label for="cargo">Cargo</label>
                            </div>
                        </div>

                        <!-- Campo Oficina -->
                        <div class="row">
                            <div class="input-field col s12">
                                <input type="text" id="oficina" name="office"
                                    [(ngModel)]="empleadoService.selectedEmpleado.office" placeholder="Lugar de trabajo"
                                    required />
                                <label for="oficina">Oficina</label>
                            </div>
                        </div>

                        <!-- Campo Salario -->
                        <div class="row">
                            <div class="input-field col s12">
                                <input type="number" id="salario" name="salary"
                                    [(ngModel)]="empleadoService.selectedEmpleado.salary"
                                    placeholder="Salario del empleado" required />
                                <label for="salario">Salario</label>
                            </div>
                        </div>
                    </div>

                    <div class="card-action">
                        <button class="btn">Guardar</button>
                        <button type="button" class="btn waves-effect waves-light grey" (click)="resetForm()">
                            Limpiar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
